<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผ่นลงชื่อออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #f7f8fb; --sheet: #ffffff; --ink: #1f2a44; --ink-soft: #5d6680;
  --pen: #2348b8; --pen-ink: #ffffff; --rule: #dfe4ef; --margin: #e2858a;
  --ok: #1f7a4d; --err: #b42318;
  --display: "Mitr", "Sarabun", system-ui, sans-serif;
  --body: "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12151d; --sheet: #1a1f2b; --ink: #e8ebf3; --ink-soft: #9aa3ba;
    --pen: #8aa6ff; --pen-ink: #0f1424; --rule: #2a3142; --margin: #b85c63;
    --ok: #5fcf96; --err: #ff8a80; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
[hidden] { display: none !important; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
header { display: grid; gap: 2px; }
h1 { font-family: var(--display); font-weight: 500; font-size: 1.6rem; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-soft); margin: 0; font-size: .95rem; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
label { display: grid; gap: 6px; font-weight: 600; font-size: .95rem; }
label span.opt { font-weight: 400; color: var(--ink-soft); }
input, textarea {
  font: inherit; font-size: 17px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; width: 100%;
}
textarea { resize: vertical; min-height: 72px; }
input.code { letter-spacing: .4em; font-variant-numeric: tabular-nums; font-size: 22px; max-width: 14rem; }
input:focus, textarea:focus { outline: 2px solid var(--pen); outline-offset: 1px; border-color: transparent; }
button.primary {
  font-family: var(--display); font-size: 1.15rem; font-weight: 500;
  background: var(--pen); color: var(--pen-ink); border: 0; border-radius: 12px;
  padding: 14px; min-height: 52px; cursor: pointer;
}
button.primary:disabled { opacity: .55; cursor: default; }
button.link { font: inherit; font-size: .92rem; color: var(--pen); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
button.link:disabled { color: var(--ink-soft); text-decoration: none; cursor: default; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.hint { margin: 0; color: var(--ink-soft); font-size: .92rem; overflow-wrap: anywhere; }
.msg { margin: 0; font-size: .92rem; min-height: 1.4em; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
.who-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; font-size: .92rem; color: var(--ink-soft); }
.who-bar strong { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; border-bottom: 2px solid var(--rule); }
.sheet-head h2 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin: 0; }
.count { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: .95rem; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 4.2rem 1fr; border-bottom: 1px solid var(--rule); }
li:last-child { border-bottom: 0; }
.day { text-align: right; padding: 12px 10px 12px 0; color: var(--ink-soft); font-size: .88rem; line-height: 1.3; font-variant-numeric: tabular-nums; border-right: 2px solid var(--margin); }
.day b { display: block; color: var(--ink); font-size: 1.05rem; font-weight: 600; }
.entry { padding: 10px 12px; min-width: 0; }
.entry .time { color: var(--pen); font-weight: 600; font-variant-numeric: tabular-nums; }
.entry .name { overflow-wrap: anywhere; }
.entry .note { color: var(--ink-soft); font-size: .95rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.empty { display: block; padding: 28px 18px; text-align: center; color: var(--ink-soft); }
@media (prefers-reduced-motion: no-preference) {
  li.fresh { animation: fade 1.2s ease-out; }
  @keyframes fade { from { background: color-mix(in srgb, var(--pen) 14%, transparent); } to { background: transparent; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ลงชื่อ</h1>
    <p class="sub" id="sub">เข้าสู่ระบบด้วยอีเมลเพื่อลงชื่อและดูประวัติของคุณ</p>
  </header>

  <!-- ขั้นที่ 1: ใส่อีเมล -->
  <form class="card" id="emailForm" novalidate>
    <label for="email">อีเมล
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
    </label>
    <button class="primary" id="sendBtn" type="submit">ส่งรหัสเข้าสู่ระบบ</button>
    <p class="msg" id="emailMsg" role="status" aria-live="polite"></p>
  </form>

  <!-- ขั้นที่ 2: ใส่รหัส -->
  <form class="card" id="codeForm" novalidate hidden>
    <p class="hint">ส่งรหัส 6 หลักไปที่ <strong id="sentTo"></strong> แล้ว (ถ้าไม่เห็น ลองดูในโฟลเดอร์สแปม)</p>
    <label for="code">รหัส 6 หลัก
      <input id="code" name="code" class="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
    </label>
    <button class="primary" id="verifyBtn" type="submit">เข้าสู่ระบบ</button>
    <div class="row">
      <button class="link" id="resendBtn" type="button">ส่งรหัสใหม่</button>
      <button class="link" id="changeEmailBtn" type="button">เปลี่ยนอีเมล</button>
    </div>
    <p class="msg" id="codeMsg" role="status" aria-live="polite"></p>
  </form>

  <!-- หลังเข้าสู่ระบบ -->
  <div id="app" hidden style="display:grid; gap:20px">
    <div class="who-bar">
      <span>เข้าสู่ระบบเป็น <strong id="meEmail"></strong></span>
      <button class="link" id="logoutBtn" type="button">ออกจากระบบ</button>
    </div>

    <form class="card" id="signForm" novalidate>
      <label for="name">ชื่อ
        <input id="name" name="name" autocomplete="name" maxlength="80" placeholder="ชื่อ - นามสกุล" required>
      </label>
      <label for="note">หมายเหตุ <span class="opt">(ไม่บังคับ)</span>
        <textarea id="note" name="note" maxlength="300" placeholder="เช่น มาสาย 10 นาที, ลากิจ"></textarea>
      </label>
      <button class="primary" id="signBtn" type="submit">ลงชื่อ</button>
      <p class="msg" id="signMsg" role="status" aria-live="polite"></p>
    </form>

    <section class="sheet" aria-labelledby="histTitle">
      <div class="sheet-head">
        <h2 id="histTitle">ประวัติการลงชื่อของฉัน</h2>
        <span class="count" id="count">—</span>
      </div>
      <ol id="list"><li class="empty">กำลังโหลดประวัติ…</li></ol>
    </section>
  </div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbw1ScVaIDz7xMdPrmK_-lVjkTdsOqIuSzm1xnbgE1p67pYVEg5TvCmivmxhQdSZUOrUDQ/exec";
const STORE_KEY = "attendance-session";
const NAME_KEY = "attendance-name";

const $ = (id) => document.getElementById(id);
let session = null;          // { token, email }
let pendingEmail = "";
let seen = new Set(), firstLoad = true, resendTimer = null;

const dayFmt = new Intl.DateTimeFormat("th-TH", { day: "numeric" });
const monFmt = new Intl.DateTimeFormat("th-TH", { month: "short" });
const yearFmt = new Intl.DateTimeFormat("th-TH", { year: "2-digit" });
const timeFmt = new Intl.DateTimeFormat("th-TH", { hour: "2-digit", minute: "2-digit" });

function say(el, text, kind) { el.textContent = text; el.className = "msg " + (kind || ""); }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function save(key, val) { try { val == null ? localStorage.removeItem(key) : localStorage.setItem(key, val); } catch (e) {} }

async function api(action, payload) {
  // text/plain ไม่ต้องผ่าน CORS preflight ซึ่ง Apps Script ไม่ตอบ
  const res = await fetch(SHEET_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, ...payload }),
  });
  return res.json();
}

const ERR = {
  bad_email: "อีเมลไม่ถูกต้อง ตรวจแล้วลองใหม่",
  email_not_allowed: "อีเมลนี้ไม่ได้รับอนุญาตให้ใช้งาน",
  wait: "เพิ่งส่งรหัสไป รอ 1 นาทีแล้วค่อยขอใหม่",
  too_many: "ขอรหัสบ่อยเกินไป รอสักครู่แล้วลองใหม่",
  mail_quota: "วันนี้ส่งอีเมลครบโควตาแล้ว ติดต่อผู้ดูแล",
  code_expired: "รหัสหมดอายุหรือใส่ผิดเกินกำหนด กด \"ส่งรหัสใหม่\"",
};

/* ---------- views ---------- */

function show(view) {
  $("emailForm").hidden = view !== "email";
  $("codeForm").hidden = view !== "code";
  $("app").hidden = view !== "app";
  $("sub").hidden = view === "app";
}

function startResendCooldown() {
  const btn = $("resendBtn");
  let left = 60;
  clearInterval(resendTimer);
  btn.disabled = true;
  btn.textContent = "ส่งรหัสใหม่ได้ใน " + left + " วิ";
  resendTimer = setInterval(() => {
    left -= 1;
    if (left <= 0) { clearInterval(resendTimer); btn.disabled = false; btn.textContent = "ส่งรหัสใหม่"; return; }
    btn.textContent = "ส่งรหัสใหม่ได้ใน " + left + " วิ";
  }, 1000);
}

function enterApp() {
  $("meEmail").textContent = session.email;
  $("name").value = load(NAME_KEY) || "";
  show("app");
  loadHistory();
}

function signOut(message) {
  if (session) api("logout", { token: session.token }).catch(() => {});
  session = null; save(STORE_KEY, null);
  seen = new Set(); firstLoad = true;
  $("code").value = "";
  show("email");
  if (message) say($("emailMsg"), message, "err");
}

/* ---------- login ---------- */

async function sendCode(email, msgEl) {
  say(msgEl, "กำลังส่งรหัส…");
  try {
    const r = await api("request_code", { email });
    if (!r.ok) { say(msgEl, ERR[r.error] || "ส่งรหัสไม่สำเร็จ ลองใหม่อีกครั้ง", "err"); return false; }
    return true;
  } catch (e) { say(msgEl, "เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่", "err"); return false; }
}

$("emailForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say($("emailMsg"), ERR.bad_email, "err"); $("email").focus(); return; }
  $("sendBtn").disabled = true;
  const ok = await sendCode(email, $("emailMsg"));
  $("sendBtn").disabled = false;
  if (!ok) return;
  pendingEmail = email;
  $("sentTo").textContent = email;
  say($("emailMsg"), ""); say($("codeMsg"), "");
  show("code"); startResendCooldown(); $("code").focus();
});

$("resendBtn").addEventListener("click", async () => {
  if (await sendCode(pendingEmail, $("codeMsg"))) { say($("codeMsg"), "ส่งรหัสใหม่แล้ว", "ok"); startResendCooldown(); }
});

$("changeEmailBtn").addEventListener("click", () => { $("code").value = ""; show("email"); $("email").focus(); });

$("codeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = $("code").value.trim();
  if (!/^\d{6}$/.test(code)) { say($("codeMsg"), "ใส่รหัสตัวเลข 6 หลักจากอีเมล", "err"); $("code").focus(); return; }
  $("verifyBtn").disabled = true; say($("codeMsg"), "กำลังตรวจรหัส…");
  try {
    const r = await api("verify_code", { email: pendingEmail, code });
    if (r.ok) {
      session = { token: r.token, email: r.email };
      save(STORE_KEY, JSON.stringify(session));
      say($("codeMsg"), ""); $("code").value = "";
      enterApp();
    } else if (r.error === "bad_code") {
      say($("codeMsg"), "รหัสไม่ถูกต้อง" + (r.left > 0 ? " ลองได้อีก " + r.left + " ครั้ง" : ""), "err");
      $("code").select();
    } else {
      say($("codeMsg"), ERR[r.error] || "เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง", "err");
    }
  } catch (err) { say($("codeMsg"), "เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่", "err"); }
  finally { $("verifyBtn").disabled = false; }
});

$("logoutBtn").addEventListener("click", () => signOut());

/* ---------- sign + history ---------- */

function renderHistory(rows) {
  const list = $("list");
  $("count").textContent = rows.length + " ครั้ง";
  list.replaceChildren();
  if (!rows.length) {
    const li = document.createElement("li"); li.className = "empty";
    li.textContent = "ยังไม่มีประวัติ ลงชื่อครั้งแรกได้จากด้านบน";
    list.append(li); return;
  }
  const thisYear = new Date().getFullYear();
  rows.forEach((r) => {
    const d = new Date(r.at);
    const li = document.createElement("li");
    if (!firstLoad && !seen.has(r.id)) li.className = "fresh";
    const day = document.createElement("div"); day.className = "day";
    const b = document.createElement("b"); b.textContent = dayFmt.format(d);
    day.append(b, monFmt.format(d) + (d.getFullYear() !== thisYear ? " " + yearFmt.format(d) : ""));
    const entry = document.createElement("div"); entry.className = "entry";
    const t = document.createElement("div"); t.className = "time"; t.textContent = timeFmt.format(d) + " น.";
    const n = document.createElement("div"); n.className = "name"; n.textContent = r.name;
    entry.append(t, n);
    if (r.note) { const nt = document.createElement("div"); nt.className = "note"; nt.textContent = r.note; entry.append(nt); }
    li.append(day, entry);
    list.append(li);
  });
  rows.forEach(r => seen.add(r.id));
  firstLoad = false;
}

async function loadHistory() {
  try {
    const r = await api("history", { token: session.token });
    if (!r.ok && r.error === "no_session") { signOut("หมดเวลาเข้าสู่ระบบ เข้าสู่ระบบอีกครั้ง"); return; }
    if (!r.ok) throw new Error(r.error);
    renderHistory(r.rows || []);
  } catch (e) {
    if (firstLoad) {
      const list = $("list"); list.replaceChildren();
      const li = document.createElement("li"); li.className = "empty";
      li.textContent = "โหลดประวัติไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า";
      list.append(li);
    }
  }
}

$("signForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("name").value.trim();
  const note = $("note").value.trim();
  const msg = $("signMsg");
  if (!name) { say(msg, "กรุณาพิมพ์ชื่อก่อนกดลงชื่อ", "err"); $("name").focus(); return; }
  $("signBtn").disabled = true; say(msg, "กำลังบันทึก…");
  try {
    const r = await api("sign", { token: session.token, name, note });
    if (!r.ok && r.error === "no_session") { signOut("หมดเวลาเข้าสู่ระบบ เข้าสู่ระบบอีกครั้งแล้วลงชื่อใหม่"); return; }
    if (!r.ok) throw new Error(r.error);
    save(NAME_KEY, name);
    $("note").value = "";
    say(msg, "ลงชื่อเรียบร้อย ✓ " + timeFmt.format(new Date()) + " น.", "ok");
    await loadHistory();
  } catch (err) {
    say(msg, "บันทึกไม่สำเร็จ ลองกดอีกครั้ง", "err");
  } finally { $("signBtn").disabled = false; }
});

/* ---------- start ---------- */

try { session = JSON.parse(load(STORE_KEY) || "null"); } catch (e) { session = null; }
if (session && session.token && session.email) enterApp(); else { session = null; show("email"); }
</script>
</body>
</html>
