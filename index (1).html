<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผ่นลงชื่อออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #f7f8fb; --sheet: #ffffff; --ink: #1f2a44; --ink-soft: #5d6680;
  --pen: #2348b8; --pen-ink: #ffffff; --rule: #dfe4ef; --margin: #e2858a;
  --ok: #1f7a4d; --err: #b42318;
  --display: "Mitr", "Sarabun", system-ui, sans-serif;
  --body: "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12151d; --sheet: #1a1f2b; --ink: #e8ebf3; --ink-soft: #9aa3ba;
    --pen: #8aa6ff; --pen-ink: #0f1424; --rule: #2a3142; --margin: #b85c63;
    --ok: #5fcf96; --err: #ff8a80; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
[hidden] { display: none !important; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
header { display: grid; gap: 2px; }
h1 { font-family: var(--display); font-weight: 500; font-size: 1.6rem; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-soft); margin: 0; font-size: .95rem; }
form { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
label { display: grid; gap: 6px; font-weight: 600; font-size: .95rem; }
label span.opt { font-weight: 400; color: var(--ink-soft); }
input, textarea {
  font: inherit; font-size: 17px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; width: 100%;
}
textarea { resize: vertical; min-height: 72px; }
input:focus, textarea:focus { outline: 2px solid var(--pen); outline-offset: 1px; border-color: transparent; }
button.sign {
  font-family: var(--display); font-size: 1.15rem; font-weight: 500;
  background: var(--pen); color: var(--pen-ink); border: 0; border-radius: 12px;
  padding: 14px; min-height: 52px; cursor: pointer;
}
button.sign:disabled { opacity: .55; cursor: default; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.msg { margin: 0; font-size: .92rem; min-height: 1.4em; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; border-bottom: 2px solid var(--rule); }
.sheet-head h2 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin: 0; }
.count { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: .95rem; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 3rem 1fr auto; align-items: start; border-bottom: 1px solid var(--rule); }
li:last-child { border-bottom: 0; }
.no { text-align: right; padding: 12px 10px 12px 0; color: var(--ink-soft); font-variant-numeric: tabular-nums; border-right: 2px solid var(--margin); align-self: stretch; }
.who { padding: 10px 12px; min-width: 0; }
.who .name { font-weight: 600; color: var(--pen); font-size: 1.05rem; overflow-wrap: anywhere; }
.who .note { font-size: .95rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.who .time { color: var(--ink-soft); font-size: .8rem; font-variant-numeric: tabular-nums; }
.del { margin: 8px 8px 0 0; font: inherit; font-size: .85rem; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.del.confirm { color: var(--err); border-color: var(--err); }
.empty { display: block; padding: 28px 18px; text-align: center; color: var(--ink-soft); }
.notice { color: var(--ink-soft); font-size: .88rem; margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  li.fresh { animation: fade 1.2s ease-out; }
  @keyframes fade { from { background: color-mix(in srgb, var(--pen) 14%, transparent); } to { background: transparent; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ลงชื่อ</h1>
    <p class="sub">กรอกชื่อแล้วกด "ลงชื่อ"</p>
  </header>

  <form id="f" novalidate>
    <label for="name">ชื่อ
      <input id="name" name="name" autocomplete="name" maxlength="80" placeholder="ชื่อ - นามสกุล" required>
    </label>
    <label for="note">หมายเหตุ <span class="opt">(ไม่บังคับ)</span>
      <textarea id="note" name="note" maxlength="300" placeholder="เช่น มาสาย 10 นาที, ลากิจ"></textarea>
    </label>
    <button class="sign" id="btn" type="submit">ลงชื่อ</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <section class="sheet" aria-labelledby="listTitle">
    <div class="sheet-head">
      <h2 id="listTitle">รายชื่อผู้ลงชื่อ</h2>
      <span class="count" id="count">—</span>
    </div>
    <ol id="list"><li class="empty">กำลังโหลดรายชื่อ…</li></ol>
  </section>
  <p class="notice" id="notice" hidden></p>
</div>

<script>
/*
 * ที่เก็บรายชื่อ
 * - ใส่ URL ของ Google Apps Script (ดู README.md) เพื่อให้ทุกคนเห็นรายชื่อชุดเดียวกัน
 * - ถ้าเว้นว่าง รายชื่อจะเก็บไว้ในเครื่องที่เปิดหน้านี้เท่านั้น
 */
const SHEET_URL = "";
const POLL_MS = 10000;
const LOCAL_KEY = "attendance-signatures";

const $ = (id) => document.getElementById(id);
const form = $("f"), btn = $("btn"), msg = $("msg"), list = $("list"), countEl = $("count"), notice = $("notice");
const shared = SHEET_URL.trim() !== "";
let rows = [], seen = new Set(), firstLoad = true, pendingDel = null;

const fmt = new Intl.DateTimeFormat("th-TH", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function say(text, kind) { msg.textContent = text; msg.className = "msg " + (kind || ""); }

/* ---------- storage ---------- */
function loadLocal() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch (e) { return []; }
}
function saveLocal(data) {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); return true; } catch (e) { return false; }
}
async function fetchRows() {
  if (!shared) return loadLocal();
  const res = await fetch(SHEET_URL + (SHEET_URL.includes("?") ? "&" : "?") + "t=" + Date.now());
  if (!res.ok) throw new Error("http " + res.status);
  const data = await res.json();
  return Array.isArray(data.rows) ? data.rows : [];
}
async function addRow(row) {
  if (!shared) {
    const data = loadLocal(); data.push(row);
    if (!saveLocal(data)) throw new Error("storage");
    return;
  }
  // text/plain avoids a CORS preflight, which Apps Script does not answer
  const res = await fetch(SHEET_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "add", ...row }) });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "save");
}
function removeLocal(id) { saveLocal(loadLocal().filter(r => r.id !== id)); }

/* ---------- render ---------- */
function render() {
  countEl.textContent = rows.length + " คน";
  list.replaceChildren();
  if (!rows.length) {
    const li = document.createElement("li"); li.className = "empty";
    li.textContent = "ยังไม่มีใครลงชื่อ เป็นคนแรกได้เลย";
    list.append(li); return;
  }
  rows.forEach((r, i) => {
    const li = document.createElement("li");
    if (!firstLoad && !seen.has(r.id)) li.className = "fresh";
    const no = document.createElement("div"); no.className = "no"; no.textContent = i + 1;
    const who = document.createElement("div"); who.className = "who";
    const n = document.createElement("div"); n.className = "name"; n.textContent = r.name || ""; who.append(n);
    if (r.note) { const t = document.createElement("div"); t.className = "note"; t.textContent = r.note; who.append(t); }
    const tm = document.createElement("div"); tm.className = "time";
    tm.textContent = r.at ? fmt.format(new Date(r.at)) : ""; who.append(tm);
    li.append(no, who);
    if (!shared) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "del" + (pendingDel === r.id ? " confirm" : "");
      b.textContent = pendingDel === r.id ? "ยืนยันลบ" : "ลบ";
      b.addEventListener("click", () => onDelete(r.id));
      li.append(b);
    } else {
      li.append(document.createElement("span"));
    }
    list.append(li);
  });
  rows.forEach(r => seen.add(r.id));
  firstLoad = false;
}

function onDelete(id) {
  if (pendingDel !== id) {
    pendingDel = id; render();
    setTimeout(() => { if (pendingDel === id) { pendingDel = null; render(); } }, 4000);
    return;
  }
  pendingDel = null; removeLocal(id); rows = loadLocal(); render(); say("ลบรายชื่อแล้ว", "ok");
}

async function refresh() {
  try { rows = await fetchRows(); rows.sort((a, b) => (a.at || 0) - (b.at || 0)); render(); }
  catch (e) { if (firstLoad) { list.replaceChildren(); const li = document.createElement("li"); li.className = "empty"; li.textContent = "โหลดรายชื่อไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า"; list.append(li); } }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("name").value.trim();
  const note = $("note").value.trim();
  if (!name) { say("กรุณาพิมพ์ชื่อก่อนกดลงชื่อ", "err"); $("name").focus(); return; }
  btn.disabled = true; say("กำลังบันทึก…");
  const row = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), name, note, at: Date.now() };
  try {
    await addRow(row);
    form.reset(); say("ลงชื่อเรียบร้อย ✓ " + name, "ok");
    await refresh();
  } catch (err) {
    say("บันทึกไม่สำเร็จ ลองกดอีกครั้ง", "err");
  } finally { btn.disabled = false; }
});

if (!shared) {
  notice.hidden = false;
  notice.textContent = "รายชื่อเก็บไว้ในเครื่องนี้เท่านั้น ถ้าต้องการให้ทุกเครื่องเห็นรายชื่อเดียวกัน ให้เชื่อมกับ Google Sheets ตามวิธีใน README";
}
refresh();
if (shared) setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
</script>
</body>
</html>
